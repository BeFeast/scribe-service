name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: scribe
          POSTGRES_PASSWORD: scribe
          POSTGRES_DB: scribe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scribe -d scribe_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The test pull doesn't need to talk to real Vast / Chhoto / codex —
      # set empty values so the Settings load.
      SCRIBE_VAST_API_KEY: ""
      SCRIBE_SHORTLINK_API_URL: ""
      SCRIBE_SHORTLINK_API_KEY: ""
      SCRIBE_TEMP_DIR: /tmp/scribe-ci
    steps:
      - uses: actions/checkout@v7

      - name: Configure database service endpoint
        shell: bash
        run: |
          if [[ "${GITHUB_SERVER_URL}" == "https://github.com" ]]; then
            postgres_host="localhost"
          else
            postgres_host="postgres"
          fi
          database_url="postgresql+psycopg://scribe:scribe@${postgres_host}:5432/scribe_test"
          {
            echo "SCRIBE_TEST_DATABASE_URL=${database_url}"
            echo "SCRIBE_DATABASE_URL=${database_url}"
          } >> "${GITHUB_ENV}"

      - name: Install ripgrep
        shell: bash
        run: |
          if command -v rg >/dev/null 2>&1; then
            rg --version
            exit 0
          fi
          if ! command -v apt-get >/dev/null 2>&1; then
            echo "ripgrep is required, and this runner has no supported package manager" >&2
            exit 1
          fi
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ripgrep
          else
            apt-get update
            apt-get install --yes ripgrep
          fi
          rg --version

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Build SPA
        run: |
          bash scripts/check-design-tokens.sh
          bash scripts/check-design-recipes.sh
          bash scripts/check-design-nesting.sh
          bash scripts/check-forbidden-primitives.sh
          bash scripts/check-no-device-chrome.sh
          cd web/spa
          bun install --frozen-lockfile
          bun run build

      - name: Sync deps (incl. dev)
        run: uv sync --frozen --all-extras --all-groups

      - name: Ruff (lint)
        run: uv run ruff check src tests

      - name: pytest
        run: uv run pytest -q
        env:
          SCRIBE_LOG_LEVEL: WARNING
